<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta id="metaThemeColor" name="theme-color" content="#060811" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="StudyFlow Pro" />
  <title>StudyFlow Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    /* ==========================================================================
       THEME SYSTEM VIA CSS VARIABLES
       1. Cyberpunk / Neon (default)
       2. AMOLED Black / Minimalism (emerald accents)
       3. Light Theme
    ========================================================================== */
    :root,
    [data-theme="cyberpunk"] {
      --bg: #060811;
      --bg-elevated: #0A0E1C;
      --card: #0F1526;
      --card-2: #171F38;
      --surface-glass-top: rgba(23, 31, 56, 0.78);
      --surface-glass-bottom: rgba(15, 21, 38, 0.88);
      --surface-hero-top: rgba(23, 31, 56, 0.92);
      --surface-hero-bottom: rgba(15, 21, 38, 0.95);
      --surface-inset: rgba(9, 13, 26, 0.85);
      --nav-bg: rgba(10, 14, 28, 0.88);
      --border-subtle: rgba(91, 108, 255, 0.22);
      --border-strong: rgba(91, 108, 255, 0.36);
      --text-primary: #F4F7FF;
      --text-secondary: #CBD5E1;
      --text-muted: #94A3B8;
      --indigo: #5B6CFF;
      --purple: #9747FF;
      --cyan: #2DE2FF;
      --accent-contrast: #060811;
      --glow-1: rgba(91, 108, 255, 0.22);
      --glow-2: rgba(151, 71, 255, 0.18);
      --glow-3: rgba(45, 226, 255, 0.05);
      --shadow-card: 0 12px 32px rgba(0, 0, 0, 0.45);
      --heat-0: #101522;
      --heat-1: #29305A;
      --heat-2: #414CC7;
      --heat-3: #7B52FF;
      --heat-4: #2DE2FF;
    }

    [data-theme="amoled"] {
      --bg: #000000;
      --bg-elevated: #050806;
      --card: #0A0E0C;
      --card-2: #111814;
      --surface-glass-top: rgba(17, 24, 20, 0.82);
      --surface-glass-bottom: rgba(8, 12, 10, 0.92);
      --surface-hero-top: rgba(16, 26, 21, 0.94);
      --surface-hero-bottom: rgba(6, 10, 8, 0.97);
      --surface-inset: rgba(5, 8, 6, 0.9);
      --nav-bg: rgba(4, 6, 5, 0.92);
      --border-subtle: rgba(16, 185, 129, 0.18);
      --border-strong: rgba(52, 211, 153, 0.34);
      --text-primary: #ECFDF5;
      --text-secondary: #A7F3D0;
      --text-muted: #6EE7B7;
      --indigo: #10B981;
      --purple: #059669;
      --cyan: #34D399;
      --accent-contrast: #000000;
      --glow-1: rgba(16, 185, 129, 0.14);
      --glow-2: rgba(52, 211, 153, 0.08);
      --glow-3: rgba(5, 150, 105, 0.05);
      --shadow-card: 0 12px 28px rgba(0, 0, 0, 0.75);
      --heat-0: #090D0B;
      --heat-1: #064E3B;
      --heat-2: #047857;
      --heat-3: #10B981;
      --heat-4: #6EE7B7;
    }

    [data-theme="light"] {
      --bg: #F3F6FC;
      --bg-elevated: #FFFFFF;
      --card: #FFFFFF;
      --card-2: #EEF2FA;
      --surface-glass-top: rgba(255, 255, 255, 0.86);
      --surface-glass-bottom: rgba(248, 250, 255, 0.94);
      --surface-hero-top: rgba(255, 255, 255, 0.96);
      --surface-hero-bottom: rgba(238, 243, 252, 0.98);
      --surface-inset: rgba(238, 242, 250, 0.92);
      --nav-bg: rgba(255, 255, 255, 0.9);
      --border-subtle: rgba(79, 70, 229, 0.14);
      --border-strong: rgba(79, 70, 229, 0.28);
      --text-primary: #0F172A;
      --text-secondary: #334155;
      --text-muted: #64748B;
      --indigo: #4F46E5;
      --purple: #7C3AED;
      --cyan: #0284C7;
      --accent-contrast: #FFFFFF;
      --glow-1: rgba(79, 70, 229, 0.10);
      --glow-2: rgba(124, 58, 237, 0.08);
      --glow-3: rgba(2, 132, 199, 0.06);
      --shadow-card: 0 10px 26px rgba(15, 23, 42, 0.08);
      --heat-0: #E2E8F0;
      --heat-1: #C7D2FE;
      --heat-2: #818CF8;
      --heat-3: #6366F1;
      --heat-4: #0284C7;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      background-color: var(--bg);
      color: var(--text-primary);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      overflow-x: hidden;
      min-height: 100dvh;
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    body::before {
      content: "";
      position: fixed;
      top: -120px;
      left: -80px;
      width: 340px;
      height: 340px;
      background: radial-gradient(circle, var(--glow-1) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    body::after {
      content: "";
      position: fixed;
      bottom: 40px;
      right: -100px;
      width: 360px;
      height: 360px;
      background: radial-gradient(circle, var(--glow-2) 0%, var(--glow-3) 45%, transparent 72%);
      pointer-events: none;
      z-index: 0;
    }

    /* Theme-aware utility overrides so Tailwind slate/white classes adapt cleanly */
    .themed-text { color: var(--text-primary); }
    .themed-subtext { color: var(--text-secondary); }
    .themed-muted { color: var(--text-muted); }
    .themed-accent { color: var(--cyan); }
    .themed-indigo-text { color: var(--indigo); }
    .themed-purple-text { color: var(--purple); }
    .themed-surface { background-color: var(--card-2); border-color: var(--border-subtle); }
    .themed-inset { background-color: var(--surface-inset); border-color: var(--border-subtle); }

    [data-theme="light"] .text-white { color: #0F172A !important; }
    [data-theme="light"] .text-slate-300,
    [data-theme="light"] .text-slate-400 { color: #475569 !important; }
    [data-theme="light"] .text-indigo-200,
    [data-theme="light"] .text-indigo-200\/80,
    [data-theme="light"] .text-indigo-300,
    [data-theme="light"] .text-indigo-300\/80 { color: #4338CA !important; }
    [data-theme="light"] .text-cyan-300,
    [data-theme="light"] .text-cyan-300\/80,
    [data-theme="light"] .text-cyan-300\/85,
    [data-theme="light"] .text-cyan-300\/90 { color: #0369A1 !important; }
    [data-theme="light"] .text-purple-300 { color: #6D28D9 !important; }
    [data-theme="light"] .bg-\[\#0B1020\],
    [data-theme="light"] .bg-\[\#0B1020\]\/80,
    [data-theme="light"] .bg-\[\#090D1A\],
    [data-theme="light"] .bg-\[\#090D1A\]\/85,
    [data-theme="light"] .bg-\[\#090D1A\]\/90 { background-color: #EEF2FA !important; }
    [data-theme="light"] .bg-\[\#171F38\] { background-color: #E2E8F0 !important; }
    [data-theme="light"] .bg-\[\#0F1526\]\/75 { background-color: rgba(255, 255, 255, 0.85) !important; }

    .mono {
      font-family: 'JetBrains Mono', monospace;
    }

    .glass-card {
      background: linear-gradient(155deg, var(--surface-glass-top) 0%, var(--surface-glass-bottom) 100%);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid var(--border-subtle);
      box-shadow: var(--shadow-card), inset 0 1px 0 rgba(255, 255, 255, 0.06);
      transition: transform 0.22s ease, border-color 0.25s ease, box-shadow 0.25s ease, background 0.25s ease;
    }

    .glass-card-active {
      background: linear-gradient(145deg, color-mix(in srgb, var(--indigo) 22%, transparent) 0%, color-mix(in srgb, var(--purple) 14%, transparent) 55%, var(--surface-hero-bottom) 100%);
      border: 1px solid var(--cyan);
      box-shadow: 0 0 24px color-mix(in srgb, var(--indigo) 26%, transparent);
    }

    .glass-hero {
      background: radial-gradient(circle at 20% 15%, color-mix(in srgb, var(--indigo) 28%, transparent), transparent 55%),
                  radial-gradient(circle at 88% 85%, color-mix(in srgb, var(--purple) 22%, transparent), transparent 55%),
                  linear-gradient(160deg, var(--surface-hero-top), var(--surface-hero-bottom));
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      border: 1px solid var(--border-strong);
      box-shadow: var(--shadow-card);
    }

    .neon-btn {
      background: linear-gradient(135deg, var(--indigo) 0%, var(--purple) 55%, var(--cyan) 100%);
      background-size: 180% 180%;
      box-shadow: 0 6px 20px color-mix(in srgb, var(--indigo) 38%, transparent);
      transition: all 0.25s ease;
      color: #FFFFFF !important;
    }

    .neon-btn:active {
      transform: scale(0.96);
    }

    .neon-btn:hover {
      background-position: right center;
    }

    .pro-badge-btn {
      background: linear-gradient(135deg, color-mix(in srgb, var(--purple) 26%, transparent), color-mix(in srgb, var(--cyan) 22%, transparent));
      border: 1px solid color-mix(in srgb, var(--cyan) 48%, transparent);
      color: var(--text-primary);
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .pro-badge-btn:active {
      transform: scale(0.96);
    }

    .chip-pill {
      background: var(--card);
      border: 1px solid var(--border-subtle);
      backdrop-filter: blur(10px);
    }

    .screen {
      display: none;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.28s ease, transform 0.28s ease;
    }

    .screen.active {
      display: block;
      opacity: 1;
      transform: translateY(0);
    }

    .nav-bar {
      background: var(--nav-bg);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      border-top: 1px solid var(--border-subtle);
      box-shadow: 0 -10px 35px rgba(0, 0, 0, 0.25);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    .nav-item.active {
      color: var(--cyan);
      background: linear-gradient(180deg, color-mix(in srgb, var(--indigo) 22%, transparent) 0%, color-mix(in srgb, var(--cyan) 10%, transparent) 100%);
      border: 1px solid color-mix(in srgb, var(--cyan) 40%, transparent);
    }

    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 20px color-mix(in srgb, var(--cyan) 28%, transparent); }
      50% { box-shadow: 0 0 36px color-mix(in srgb, var(--indigo) 42%, transparent); }
    }

    .avatar-glow {
      animation: pulseGlow 3.2s infinite ease-in-out;
    }

    @keyframes floatXp {
      0% { opacity: 0; transform: translateY(12px) scale(0.85); }
      20% { opacity: 1; transform: translateY(0) scale(1.05); }
      80% { opacity: 1; transform: translateY(-28px) scale(1); }
      100% { opacity: 0; transform: translateY(-48px) scale(0.95); }
    }

    .xp-floater {
      position: fixed;
      z-index: 9999;
      pointer-events: none;
      animation: floatXp 1.5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.88) translateY(16px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }

    .modal-pop {
      animation: popIn 0.26s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .heatmap-cell {
      width: 11px;
      height: 11px;
      border-radius: 3px;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      cursor: pointer;
    }

    .heatmap-cell:hover, .heatmap-cell.selected {
      transform: scale(1.28);
      box-shadow: 0 0 8px var(--cyan);
      outline: 1px solid var(--cyan);
    }

    input, select, textarea {
      user-select: text;
    }

    ::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: color-mix(in srgb, var(--indigo) 40%, transparent);
      border-radius: 999px;
    }
  </style>
</head>
<body class="pb-28" style="padding-top: env(safe-area-inset-top, 0px);">
  <div id="app" class="relative z-10 max-w-md mx-auto px-4 pt-3 sm:pt-4">
    <!-- TOP HEADER -->
    <header class="flex items-center justify-between gap-2 mb-4">
      <div class="min-w-0">
        <div id="headerSubtitle" class="text-xs font-medium text-indigo-300/80 tracking-wide truncate"></div>
        <div class="flex items-center gap-1.5 mt-0.5">
          <h1 id="headerGreeting" class="text-lg sm:text-xl font-extrabold tracking-tight text-white truncate"></h1>
          <button id="btnEditName" class="w-7 h-7 rounded-xl chip-pill flex items-center justify-center text-cyan-300 hover:border-cyan-400/60 transition shrink-0" title="Edit Name">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16.862 4.487a2.1 2.1 0 112.97 2.97L7.5 19.79l-4 1 1-4L16.862 4.487z"/></svg>
          </button>
        </div>
      </div>

      <div class="flex items-center gap-1.5 shrink-0">
        <button id="btnHeaderPro" class="pro-badge-btn px-2.5 py-1.5 rounded-xl text-[11px] font-black tracking-wide flex items-center gap-1">
          <span>✦</span> <span>PRO</span>
        </button>

        <div class="chip-pill rounded-xl p-0.5 flex items-center text-[11px] font-bold">
          <button id="langUA" class="px-2 py-1 rounded-lg transition">UA</button>
          <button id="langRU" class="px-2 py-1 rounded-lg transition">RU</button>
        </div>
      </div>
    </header>

    <!-- ========================================== -->
    <!-- SCREEN 1: FOCUS                            -->
    <!-- ========================================== -->
    <section id="screen-focus" class="screen active space-y-5">
      <!-- ACTIVE TIMER CARD (VISIBLE WHEN SESSION EXISTS) -->
      <div id="activeTimerContainer" class="hidden glass-hero rounded-3xl p-5 relative overflow-hidden">
        <div class="flex items-center justify-between mb-3">
          <div class="flex items-center gap-2">
            <span id="timerStatusDot" class="w-2.5 h-2.5 rounded-full bg-cyan-400 animate-ping"></span>
            <span id="timerStatusLabel" class="text-xs font-extrabold uppercase tracking-wider text-cyan-300"></span>
          </div>
          <span id="timerModeBadge" class="text-xs font-semibold px-3 py-1 rounded-full bg-indigo-500/20 border border-indigo-400/35 text-indigo-200"></span>
        </div>

        <div class="flex items-center gap-3 mb-4">
          <div id="timerSkillIcon" class="w-11 h-11 rounded-2xl bg-[#171F38] border border-indigo-400/30 flex items-center justify-center text-2xl"></div>
          <div>
            <div id="timerSkillName" class="font-bold text-base text-white"></div>
            <div id="timerSkillStage" class="text-xs text-cyan-300/90 font-medium"></div>
          </div>
        </div>

        <!-- BIG CIRCULAR PROGRESS -->
        <div class="relative w-52 h-52 sm:w-56 sm:h-56 mx-auto my-2 flex items-center justify-center">
          <svg class="w-full h-full -rotate-90" viewBox="0 0 220 220">
            <defs>
              <linearGradient id="timerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="var(--cyan)"/>
                <stop offset="50%" stop-color="var(--indigo)"/>
                <stop offset="100%" stop-color="var(--purple)"/>
              </linearGradient>
            </defs>
            <circle cx="110" cy="110" r="94" stroke="color-mix(in srgb, var(--indigo) 18%, transparent)" stroke-width="10" fill="none" />
            <circle id="timerProgressRing" cx="110" cy="110" r="94" stroke="url(#timerGrad)" stroke-width="10" stroke-linecap="round" fill="none" stroke-dasharray="590.6" stroke-dashoffset="590.6" style="transition: stroke-dashoffset 0.5s linear;" />
          </svg>
          <div class="absolute inset-0 flex flex-col items-center justify-center text-center">
            <div id="timerClockDisplay" class="mono text-4xl font-extrabold tracking-tight text-white">00:00</div>
            <div id="timerTargetSub" class="text-[11px] text-indigo-200/75 mt-1 font-medium"></div>
          </div>
        </div>

        <!-- LIVE METRICS -->
        <div class="grid grid-cols-3 gap-2 my-4">
          <div class="bg-[#0B1020]/80 border border-indigo-500/20 rounded-2xl p-2.5 text-center">
            <div class="text-[11px] text-slate-400" data-i18n="xpEarned"></div>
            <div id="timerLiveXp" class="mono text-sm font-extrabold text-cyan-300 mt-0.5">+0.0</div>
          </div>
          <div class="bg-[#0B1020]/80 border border-indigo-500/20 rounded-2xl p-2.5 text-center">
            <div class="text-[11px] text-slate-400" data-i18n="toSkill"></div>
            <div id="timerLiveSkillMin" class="mono text-sm font-extrabold text-white mt-0.5">0 мин</div>
          </div>
          <div class="bg-[#0B1020]/80 border border-indigo-500/20 rounded-2xl p-2.5 text-center">
            <div class="text-[11px] text-slate-400" data-i18n="rate"></div>
            <div id="timerLiveRate" class="mono text-sm font-extrabold text-purple-300 mt-0.5">×1.5</div>
          </div>
        </div>

        <!-- CONTROLS -->
        <div class="grid grid-cols-2 gap-3">
          <button id="btnPauseResume" class="py-3.5 px-4 rounded-2xl bg-[#171F38] border border-indigo-400/35 font-bold text-sm text-white flex items-center justify-center gap-2 hover:border-cyan-400/60 transition"></button>
          <button id="btnFinishSession" class="py-3.5 px-4 rounded-2xl neon-btn font-extrabold text-sm text-white flex items-center justify-center gap-2"></button>
        </div>
        <button id="btnCancelSession" class="w-full mt-3 text-xs text-slate-400 hover:text-rose-300 transition py-1" data-i18n="cancelNoSave"></button>
      </div>

      <!-- MODE SELECTOR -->
      <div>
        <div class="flex items-center justify-between mb-2.5">
          <span class="text-xs font-extrabold uppercase tracking-wider text-indigo-200/80" data-i18n="focusModeTitle"></span>
          <span class="text-xs text-cyan-300/80 font-medium" data-i18n="baseXpNote"></span>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <button id="modeDeepBtn" class="glass-card glass-card-active rounded-2xl p-3.5 text-left relative">
            <div class="flex items-center justify-between mb-2.5">
              <div class="w-9 h-9 rounded-xl bg-indigo-500/25 border border-cyan-400/40 flex items-center justify-center text-cyan-300">
                ⚡
              </div>
              <span id="modeDeepCheck" class="w-5 h-5 rounded-full bg-cyan-400 text-[#060811] flex items-center justify-center text-xs font-black">✓</span>
            </div>
            <div class="font-bold text-sm text-white" data-i18n="deepStudy"></div>
            <div class="text-[11px] text-cyan-300/90 mt-0.5 font-medium" data-i18n="deepStudyDesc"></div>
          </button>

          <button id="modeRoutineBtn" class="glass-card rounded-2xl p-3.5 text-left relative">
            <div class="flex items-center justify-between mb-2.5">
              <div class="w-9 h-9 rounded-xl bg-purple-500/20 border border-purple-400/30 flex items-center justify-center text-purple-300">
                ☕
              </div>
              <span id="modeRoutineCheck" class="hidden w-5 h-5 rounded-full bg-purple-400 text-[#060811] flex items-center justify-center text-xs font-black">✓</span>
            </div>
            <div class="font-bold text-sm text-white" data-i18n="routineDuty"></div>
            <div class="text-[11px] text-slate-400 mt-0.5 font-medium" data-i18n="routineDutyDesc"></div>
          </button>
        </div>
      </div>

      <!-- DAILY PROGRESS CARD -->
      <div class="glass-hero rounded-3xl p-5">
        <div class="flex items-center gap-4">
          <div class="relative w-24 h-24 shrink-0 flex items-center justify-center">
            <svg class="w-full h-full -rotate-90" viewBox="0 0 100 100">
              <defs>
                <linearGradient id="dailyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="var(--cyan)"/>
                  <stop offset="100%" stop-color="var(--purple)"/>
                </linearGradient>
              </defs>
              <circle cx="50" cy="50" r="40" stroke="color-mix(in srgb, var(--indigo) 20%, transparent)" stroke-width="8" fill="none"/>
              <circle id="dailyProgressCircle" cx="50" cy="50" r="40" stroke="url(#dailyGrad)" stroke-width="8" stroke-linecap="round" fill="none" stroke-dasharray="251.3" stroke-dashoffset="251.3" style="transition: stroke-dashoffset 0.5s ease;"/>
            </svg>
            <div id="dailyPercentText" class="mono text-base font-extrabold text-white absolute">0%</div>
          </div>

          <div class="flex-1 min-w-0">
            <div class="flex items-center justify-between gap-2">
              <span class="text-xs font-semibold text-cyan-300 truncate" data-i18n="focusToday"></span>
              <button id="btnEditDailyGoal" class="text-[11px] text-indigo-200/80 underline hover:text-cyan-300 shrink-0" data-i18n="editGoal"></button>
            </div>
            <div id="dailyFocusMinutesText" class="text-2xl font-black text-white mt-0.5">0 мин</div>
            <div id="dailyGoalSubtext" class="text-xs text-slate-300/80 mt-0.5"></div>
          </div>
        </div>

        <div class="flex flex-wrap gap-2 mt-4 pt-3.5 border-t border-indigo-400/15">

  <script>
    /* ============================================================================
       1. PWA MANIFEST & SERVICE WORKER REGISTRATION (SELF-CONTAINED)
    ============================================================================ */
    const THEME_META_COLORS = {
      cyberpunk: '#060811',
      amoled: '#000000',
      light: '#F3F6FC'
    };

    function syncPwaThemeColor(themeName) {
      const color = THEME_META_COLORS[themeName] || '#060811';
      const meta = document.getElementById('metaThemeColor');
      if (meta) meta.setAttribute('content', color);
    }

    (function setupPWA() {
      const iconSvg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
        <defs>
          <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#5B6CFF"/>
            <stop offset="50%" stop-color="#9747FF"/>
            <stop offset="100%" stop-color="#2DE2FF"/>
          </linearGradient>
        </defs>
        <rect width="512" height="512" rx="120" fill="#060811"/>
        <circle cx="256" cy="256" r="175" fill="none" stroke="url(#g)" stroke-width="28"/>
        <path d="M256 145v115l78 48" fill="none" stroke="#2DE2FF" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>`;
      const iconUrl = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(iconSvg)));

      const linkIcon = document.createElement('link');
      linkIcon.rel = 'icon';
      linkIcon.href = iconUrl;
      document.head.appendChild(linkIcon);

      const appleIcon = document.createElement('link');
      appleIcon.rel = 'apple-touch-icon';
      appleIcon.href = iconUrl;
      document.head.appendChild(appleIcon);

      const manifest = {
        name: "StudyFlow Pro",
        short_name: "StudyFlow",
        start_url: "./",
        scope: "./",
        display: "standalone",
        background_color: "#060811",
        theme_color: "#060811",
        icons: [
          { src: iconUrl, sizes: "192x192", type: "image/svg+xml", purpose: "any maskable" },
          { src: iconUrl, sizes: "512x512", type: "image/svg+xml", purpose: "any maskable" }
        ]
      };
      const manifestBlob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
      const manifestLink = document.createElement('link');
      manifestLink.rel = 'manifest';
      manifestLink.href = URL.createObjectURL(manifestBlob);
      document.head.appendChild(manifestLink);

      if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.protocol === 'http:')) {
        const swCode = `
          const CACHE_NAME = 'studyflow-pro-v2';
          self.addEventListener('install', e => {
            self.skipWaiting();
          });
          self.addEventListener('activate', e => {
            e.waitUntil(clients.claim());
          });
          self.addEventListener('fetch', e => {
            if (e.request.method !== 'GET') return;
            e.respondWith(
              caches.match(e.request).then(cached => {
                const fetched = fetch(e.request).then(resp => {
                  if (resp && resp.status === 200) {
                    const clone = resp.clone();
                    caches.open(CACHE_NAME).then(cache => cache.put(e.request, clone));
                  }
                  return resp;
                }).catch(() => cached);
                return cached || fetched;
              })
            );
          });
        `;
        try {
          const swBlob = new Blob([swCode], { type: 'application/javascript' });
          navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(() => {});
        } catch (err) {}
      }
    })();

    /* ============================================================================
       2. STORAGE ABSTRACTION LAYER (LOCALSTORAGE NOW -> SUPABASE / FIREBASE LATER)
       ----------------------------------------------------------------------------
       Чтобы подключить облачный бэкенд в будущем:
       1. Реализуйте класс SupabaseStorageAdapter или FirebaseStorageAdapter с теми же
          методами: load(), save(state), clear().
       2. Передайте нужный адаптер в StorageService.setAdapter(adapter).
       3. При входе пользователя можно синхронизировать локальный стейт с облаком.
    ============================================================================ */
    const STORAGE_KEY = 'studyflow_pro_state_v1';

    class LocalStorageAdapter {
      constructor(key) {
        this.key = key;
      }
      load() {
        try {
          const raw = localStorage.getItem(this.key);
          return raw ? JSON.parse(raw) : null;
        } catch (e) {
          return null;
        }
      }
      save(data) {
        try {
          localStorage.setItem(this.key, JSON.stringify(data));
          return true;
        } catch (e) {
          return false;
        }

    function xpRequiredForLevel(level) {
      return Math.round(100 + Math.pow(level - 1, 1.45) * 45);
    }

    function calculateLevelProgress(totalXp) {
      let level = 1;
      let remaining = Math.max(0, totalXp);
      let req = xpRequiredForLevel(level);
      while (remaining >= req) {
        remaining -= req;
        level++;
        req = xpRequiredForLevel(level);
      }
      return {
        level,
        currentLevelXp: Math.round(remaining),
        nextLevelXp: req,
        percent: Math.min(100, Math.round((remaining / req) * 100))
      };
    }

    function getRankByLevel(level) {
      let current = RANKS[0];
      let next = null;
      for (let i = 0; i < RANKS.length; i++) {
        if (level >= RANKS[i].minLevel) {
          current = RANKS[i];
          next = RANKS[i + 1] || null;
        }
      }
      return { current, next };
    }

      const parsed = StorageService.load();
      if (!parsed || typeof parsed !== 'object') return getDefaultState();
      return {
        ...getDefaultState(),
        ...parsed,
        timer: { ...getDefaultState().timer, ...(parsed.timer || {}) }
      };
    }

    let state = loadState();

    function saveState() {
      StorageService.save(state);
    }

    function applyTheme(themeName) {
      const validThemes = ['cyberpunk', 'amoled', 'light'];
      const chosen = validThemes.includes(themeName) ? themeName : 'cyberpunk';
      state.theme = chosen;
      document.documentElement.setAttribute('data-theme', chosen);
      syncPwaThemeColor(chosen);
      saveState();
      renderThemeButtons();
      if (state.activeTab === 'analytics') {
        renderAnalyticsScreen();
      }
    }

    function t(key) {
      return (translations[state.lang] && translations[state.lang][key]) || translations.ru[key] || key;
    }

    /* ============================================================================
       6. HELPER FORMATTERS & SKILL STAGE CALCULATOR
    ============================================================================ */
    function formatHoursMinutes(totalMins) {
      const m = Math.round(totalMins);
      const h = Math.floor(m / 60);
      const rem = m % 60;
      if (h === 0) return `${rem} ${t('minShort')}`;
      return `${h} ${t('hourShort')} ${rem} ${t('minShort')}`;
    }

    function formatShortHours(totalMins) {
      const h = totalMins / 60;
      if (h === 0) return `0 ${t('hourShort')}`;
      return `${h % 1 === 0 ? h : h.toFixed(1)} ${t('hourShort')}`;
    }

    function getSkillRoadmapStatus(skill) {
      const hours = (skill.focusMinutes || 0) / 60;
      const stages = [...(skill.roadmap || [])].sort((a, b) => a.hours - b.hours);
      if (stages.length === 0) {
        return {
          currentStageName: `${t('levelWord')} ${Math.floor(hours / 10) + 1}`,
          nextStageName: null,
          nextStageHours: null,
          remainingHours: 0,
          progressPercent: 100,
          overallPercent: 100,
          passedCount: 0,
          totalCount: 0,
          stages: []
        };
      }

      let currentIdx = 0;
      for (let i = 0; i < stages.length; i++) {
        if (hours >= stages[i].hours) currentIdx = i;
      }

      const currentStage = stages[currentIdx];
      const nextStage = stages[currentIdx + 1] || null;
      let progressPercent = 100;
      let remainingHours = 0;

      if (nextStage) {
        const span = Math.max(0.1, nextStage.hours - currentStage.hours);
        const done = Math.max(0, hours - currentStage.hours);
        progressPercent = Math.min(100, Math.round((done / span) * 100));
        remainingHours = Math.max(0, nextStage.hours - hours);
      }

      const maxHours = stages[stages.length - 1].hours || 1;
      const overallPercent = Math.min(100, Math.round((hours / maxHours) * 100));

      return {
        currentStageName: currentStage.name,
        nextStageName: nextStage ? nextStage.name : null,
        nextStageHours: nextStage ? nextStage.hours : null,
        remainingHours,
        progressPercent,
        overallPercent,
        passedCount: stages.filter(s => hours >= s.hours).length,
        totalCount: stages.length,
        stages
      };
    }

    function calculateStreaks() {
      const dayMinutes = {};
      state.sessions.forEach(s => {
        dayMinutes[s.date] = (dayMinutes[s.date] || 0) + s.minutes;
      });

      const validDates = Object.keys(dayMinutes).filter(d => dayMinutes[d] >= 5).sort();
      const validSet = new Set(validDates);

      let best = 0;
      let run = 0;
      let prevTime = null;
      validDates.forEach(dateStr => {
        const curTime = new Date(dateStr + 'T00:00:00').getTime();
        if (prevTime !== null && Math.round((curTime - prevTime) / 86400000) === 1) {
          run++;
        } else {
          run = 1;
        }
        if (run > best) best = run;
        prevTime = curTime;
      });

      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const todayStr = getTodayISO();
      const todayCounted = validSet.has(todayStr);

      let current = 0;
      let cursor = new Date(today);
      if (!todayCounted) {
        cursor.setDate(cursor.getDate() - 1);
      }
      while (true) {
        const iso = `${cursor.getFullYear()}-${String(cursor.getMonth() + 1).padStart(2, '0')}-${String(cursor.getDate()).padStart(2, '0')}`;
        if (validSet.has(iso)) {
          current++;
          cursor.setDate(cursor.getDate() - 1);
        } else {
          break;
        }
      }

      if (current > best) best = current;
      return { current, best, todayCounted, validSet };
    }

    function spawnFloatingXp(text) {
      const el = document.createElement('div');
      el.className = 'xp-floater mono font-black text-lg text-cyan-300';
      el.style.left = `${30 + Math.random() * 35}%`;
      el.style.top = '38%';
      el.textContent = text;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 1550);
    }

    /* ============================================================================
       7. TIMER ENGINE (PERSISTENT ACROSS RELOADS + BEFOREUNLOAD GUARD)
    ============================================================================ */
    let timerInterval = null;

    function getElapsedSeconds() {
      if (!state.timer.isActive) return 0;
      let total = state.timer.accumulatedSeconds || 0;
      if (!state.timer.isPaused && state.timer.lastResumedAt) {
        total += Math.floor((Date.now() - state.timer.lastResumedAt) / 1000);
      }
      return Math.max(0, total);
    }

    function startTimerForSkill(skillId, targetMinutes = 25) {
      state.timer = {
        isActive: true,
        isPaused: false,
        skillId,
        mode: state.focusMode,
        targetMinutes: Math.max(1, Number(targetMinutes) || 25),
        accumulatedSeconds: 0,
        lastResumedAt: Date.now()
      };
      saveState();
      ensureTimerLoop();
      renderAll();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function togglePauseTimer() {
      if (!state.timer.isActive) return;
      if (state.timer.isPaused) {
        state.timer.isPaused = false;
        state.timer.lastResumedAt = Date.now();
      } else {
        state.timer.accumulatedSeconds = getElapsedSeconds();
        state.timer.isPaused = true;
        state.timer.lastResumedAt = null;
      }
      saveState();
      updateTimerUI();
    }

    function cancelTimerWithoutSave() {
      state.timer = {
        isActive: false,
        isPaused: false,
        skillId: null,
        mode: state.focusMode,
        targetMinutes: 25,
        accumulatedSeconds: 0,
        lastResumedAt: null
      };
      saveState();
      renderAll();
    }

    function finishTimerSession() {
      if (!state.timer.isActive) return;
      const elapsedSec = getElapsedSeconds();
      const minutes = Math.max(1, Math.round(elapsedSec / 60));
      const skillId = state.timer.skillId;
      const mode = state.timer.mode;

      state.timer = {
        isActive: false,
        isPaused: false,
        skillId: null,
        mode: state.focusMode,
        targetMinutes: 25,
        accumulatedSeconds: 0,
        lastResumedAt: null
      };

      recordStudySession(skillId, minutes, mode, true);
    }

    function recordStudySession(skillId, minutes, mode, showCelebration = true) {
      const cleanMin = Math.max(1, Math.round(Number(minutes)));
      const multiplier = mode === 'deep' ? 1.5 : 0.5;
      const earnedXp = Math.round(cleanMin * multiplier * 10) / 10;

      const prevLevel = calculateLevelProgress(state.totalXp).level;
      const todayStr = getTodayISO();
      const prevTodayFocus = state.sessions
        .filter(s => s.date === todayStr && s.mode === 'deep')
        .reduce((acc, s) => acc + s.minutes, 0);

      state.totalXp = Math.round((state.totalXp + earnedXp) * 10) / 10;
      const newLevel = calculateLevelProgress(state.totalXp).level;

      const skill = state.skills.find(s => s.id === skillId) || state.skills[0];
      if (skill) {
        if (mode === 'deep') {
          skill.focusMinutes = (skill.focusMinutes || 0) + cleanMin;
        } else {
          skill.routineMinutes = (skill.routineMinutes || 0) + cleanMin;
        }
        skill.sessionsCount = (skill.sessionsCount || 0) + 1;
      }

      state.sessions.push({
        id: 'sess_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
        date: todayStr,
        skillId: skill ? skill.id : 'unknown',
        skillName: skill ? skill.name : 'Focus',
        mode,
        minutes: cleanMin,
        xp: earnedXp,
        timestamp: Date.now()
      });

      const newTodayFocus = state.sessions
        .filter(s => s.date === todayStr && s.mode === 'deep')
        .reduce((acc, s) => acc + s.minutes, 0);

      const goalJustCompleted = prevTodayFocus < state.dailyGoalMinutes && newTodayFocus >= state.dailyGoalMinutes;
      const leveledUp = newLevel > prevLevel;

      saveState();
      renderAll();
      spawnFloatingXp(`+${earnedXp} XP`);

      if (showCelebration) {
        openSessionCelebrationModal({
          skillName: skill ? skill.name : '',
          skillIcon: skill ? skill.icon : '⚡',
          minutes: cleanMin,
          earnedXp,
          mode,
          leveledUp,
          newLevel,
          goalJustCompleted
        });
      }
    }

    function ensureTimerLoop() {
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        if (state.timer.isActive) {
          updateTimerUI();
        }
      }, 500);
    }

    function updateTimerUI() {
      const container = document.getElementById('activeTimerContainer');
      if (!state.timer.isActive) {
        container.classList.add('hidden');
        return;
      }
      container.classList.remove('hidden');

      const skill = state.skills.find(s => s.id === state.timer.skillId) || state.skills[0];
      const stageInfo = skill ? getSkillRoadmapStatus(skill) : null;
      const elapsedSec = getElapsedSeconds();
      const mins = Math.floor(elapsedSec / 60);
      const secs = elapsedSec % 60;
      const targetSec = (state.timer.targetMinutes || 25) * 60;
      const ratio = Math.min(1, elapsedSec / targetSec);
      const circumference = 590.6;

      document.getElementById('timerProgressRing').style.strokeDashoffset = circumference * (1 - ratio);
      document.getElementById('timerClockDisplay').textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
      document.getElementById('timerTargetSub').textContent = `${t('targetSessionLabel')}: ${state.timer.targetMinutes} ${t('minShort')}`;

      const dot = document.getElementById('timerStatusDot');
      const statusLabel = document.getElementById('timerStatusLabel');
      if (state.timer.isPaused) {
        dot.classList.remove('animate-ping', 'bg-cyan-400');
        dot.classList.add('bg-amber-400');
        statusLabel.textContent = t('sessionPaused');
        statusLabel.className = 'text-xs font-extrabold uppercase tracking-wider text-amber-300';
      } else {
        dot.classList.add('animate-ping', 'bg-cyan-400');
        dot.classList.remove('bg-amber-400');
        statusLabel.textContent = t('sessionRunning');
        statusLabel.className = 'text-xs font-extrabold uppercase tracking-wider text-cyan-300';
      }

      const isDeep = state.timer.mode === 'deep';
      document.getElementById('timerModeBadge').textContent = isDeep ? `⚡ ${t('deepStudy')}` : `☕ ${t('routineDuty')}`;
      document.getElementById('timerSkillIcon').textContent = skill ? skill.icon : '⚡';
      document.getElementById('timerSkillName').textContent = skill ? skill.name : '';
      document.getElementById('timerSkillStage').textContent = stageInfo && stageInfo.nextStageName
        ? `${stageInfo.currentStageName} → ${stageInfo.nextStageName}`
        : (stageInfo ? stageInfo.currentStageName : '');

      const mult = isDeep ? 1.5 : 0.5;
      const liveXp = ((elapsedSec / 60) * mult).toFixed(1);
      document.getElementById('timerLiveXp').textContent = `+${liveXp}`;
      document.getElementById('timerLiveSkillMin').textContent = isDeep ? `${mins} ${t('minShort')}` : `0 ${t('minShort')}`;
      document.getElementById('timerLiveRate').textContent = `×${mult}`;

      const pauseBtn = document.getElementById('btnPauseResume');
      pauseBtn.innerHTML = state.timer.isPaused
        ? `<span>▶</span> <span>${t('resume')}</span>`
        : `<span>⏸</span> <span>${t('pause')}</span>`;

      document.getElementById('btnFinishSession').innerHTML = `<span>⏹</span> <span>${t('finish')}</span>`;
    }

    /* ============================================================================
       8. RENDERING ALL 4 SCREENS
    ============================================================================ */
    function renderHeader() {
      const now = new Date();
      const hour = now.getHours();
      let greetKey = 'greetingDay';
      if (hour >= 5 && hour < 12) greetKey = 'greetingMorning';
      else if (hour >= 12 && hour < 18) greetKey = 'greetingDay';
      else if (hour >= 18 && hour < 23) greetKey = 'greetingEvening';
      else greetKey = 'greetingNight';

      const locale = state.lang === 'ua' ? 'uk-UA' : 'ru-RU';
      const dateStr = now.toLocaleDateString(locale, { weekday: 'long', day: 'numeric', month: 'long' });
      document.getElementById('headerSubtitle').textContent = dateStr.charAt(0).toUpperCase() + dateStr.slice(1);
      document.getElementById('headerGreeting').textContent = `${t(greetKey)}, ${state.userName}`;

      const uaBtn = document.getElementById('langUA');
      const ruBtn = document.getElementById('langRU');
      if (state.lang === 'ua') {
        uaBtn.className = 'px-2 py-1 rounded-lg neon-btn font-black';
        ruBtn.className = 'px-2 py-1 rounded-lg text-slate-400 hover:text-white';
      } else {
        ruBtn.className = 'px-2 py-1 rounded-lg neon-btn font-black';
        uaBtn.className = 'px-2 py-1 rounded-lg text-slate-400 hover:text-white';
      }
    }

    function renderThemeButtons() {
      document.querySelectorAll('.theme-option-btn').forEach(btn => {
        const th = btn.getAttribute('data-theme-choice');
        if (th === state.theme) {
          btn.className = 'theme-option-btn glass-card-active rounded-2xl p-3 text-left border transition';
        } else {
          btn.className = 'theme-option-btn glass-card rounded-2xl p-3 text-left border transition opacity-80 hover:opacity-100';
        }
      });
    }

    function renderStaticTranslations() {
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        el.textContent = t(key);
      });
    }

    function renderFocusScreen() {
      updateTimerUI();

      const deepBtn = document.getElementById('modeDeepBtn');
      const routineBtn = document.getElementById('modeRoutineBtn');
      const deepCheck = document.getElementById('modeDeepCheck');
      const routineCheck = document.getElementById('modeRoutineCheck');

      if (state.focusMode === 'deep') {
        deepBtn.classList.add('glass-card-active');
        routineBtn.classList.remove('glass-card-active');
        deepCheck.classList.remove('hidden');
        routineCheck.classList.add('hidden');
      } else {
        routineBtn.classList.add('glass-card-active');
        deepBtn.classList.remove('glass-card-active');
        routineCheck.classList.remove('hidden');
        deepCheck.classList.add('hidden');
      }

      const todayStr = getTodayISO();
      const todaySessions = state.sessions.filter(s => s.date === todayStr);
      const todayFocusMin = todaySessions.filter(s => s.mode === 'deep').reduce((a, b) => a + b.minutes, 0);
      const todayRoutineMin = todaySessions.filter(s => s.mode === 'routine').reduce((a, b) => a + b.minutes, 0);
      const todayXp = Math.round(todaySessions.reduce((a, b) => a + b.xp, 0));

      const goal = Math.max(1, state.dailyGoalMinutes || 120);
      const pct = Math.min(100, Math.round((todayFocusMin / goal) * 100));
      const circ = 251.3;
      document.getElementById('dailyProgressCircle').style.strokeDashoffset = circ * (1 - pct / 100);
      document.getElementById('dailyPercentText').textContent = `${pct}%`;
      document.getElementById('dailyFocusMinutesText').textContent = `${todayFocusMin} ${t('minShort')}`;
      document.getElementById('dailyGoalSubtext').textContent = `${t('goalPrefix')} ${formatShortHours(goal)} (${goal} ${t('minShort')})`;

      const streakInfo = calculateStreaks();
      document.getElementById('dailyStreakBadge').textContent = `🔥 ${streakInfo.current} ${t('streakDays')}`;
      document.getElementById('dailyRoutineBadge').textContent = `☕ ${t('routineShort')} ${todayRoutineMin} ${t('minShort')}`;
      document.getElementById('dailyXpBadge').textContent = `✨ +${todayXp} XP`;

      const listEl = document.getElementById('focusSkillsList');
      listEl.innerHTML = '';
      state.skills.forEach(skill => {

        const nextText = st.nextStageName
          ? `${t('toStagePrefix')} ${st.nextStageName}: ${st.remainingHours % 1 === 0 ? st.remainingHours : st.remainingHours.toFixed(1)} ${t('hourShort')}`
          : t('maxStageReached');

        const card = document.createElement('div');
        card.className = 'glass-card rounded-3xl p-4 flex items-center gap-3.5';
        card.innerHTML = `
          <div class="w-12 h-12 rounded-2xl flex items-center justify-center text-2xl shrink-0 border" style="background:${skill.color}22; border-color:${skill.color}55;">
            ${skill.icon}
          </div>
          <div class="flex-1 min-w-0">
            <div class="flex items-center gap-2">
              <span class="font-bold text-base text-white truncate">${escapeHtml(skill.name)}</span>
              <span class="px-2 py-0.5 rounded-full text-[11px] font-extrabold shrink-0" style="background:${skill.color}28; color:${skill.color}; border:1px solid ${skill.color}55;">
                ${escapeHtml(st.currentStageName)}

              <span>${hoursDone}</span>

          <button data-start-skill="${skill.id}" class="w-11 h-11 rounded-full neon-btn flex items-center justify-center text-white shrink-0 shadow-lg" title="Start">
            <svg class="w-5 h-5 translate-x-0.5" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          </button>
        `;
        listEl.appendChild(card);
      });

      listEl.querySelectorAll('[data-start-skill]').forEach(btn => {
        btn.addEventListener('click', () => {
          const sid = btn.getAttribute('data-start-skill');
          openStartTimerModal(sid);
        });
      });
    }

    function renderSkillsScreen() {
      document.getElementById('skillsTotalCount').textContent = state.skills.length;
      const totalFocusMins = state.skills.reduce((a, b) => a + (b.focusMinutes || 0), 0);
      document.getElementById('skillsTotalHours').textContent = formatShortHours(totalFocusMins);

      let passedCheckpoints = 0;
      let totalCheckpoints = 0;
      state.skills.forEach(sk => {
        const st = getSkillRoadmapStatus(sk);
        passedCheckpoints += st.passedCount;
        totalCheckpoints += st.totalCount;
      });
      document.getElementById('skillsTotalCheckpoints').textContent = `${passedCheckpoints}/${totalCheckpoints}`;

      const container = document.getElementById('skillsRoadmapContainer');
      container.innerHTML = '';

      state.skills.forEach(skill => {
        const st = getSkillRoadmapStatus(skill);
        const isExpanded = state.expandedSkillId === skill.id;
        const currentHours = (skill.focusMinutes || 0) / 60;
        const maxStageHours = st.stages.length > 0 ? st.stages[st.stages.length - 1].hours : 0;

        const card = document.createElement('div');
        card.className = 'glass-card rounded-3xl p-4 transition';

        let roadmapHtml = '';
        if (isExpanded) {
          const stagesRows = st.stages.map((stage, idx) => {
            const passed = currentHours >= stage.hours;
            const prevH = idx > 0 ? st.stages[idx - 1].hours : 0;
            const isCurrentTarget = !passed && (idx === 0 || currentHours >= prevH);
            let stagePct = passed ? 100 : 0;
            if (isCurrentTarget) {
              const span = Math.max(0.1, stage.hours - prevH);
              stagePct = Math.min(100, Math.max(0, Math.round(((currentHours - prevH) / span) * 100)));
            }
            const remH = Math.max(0, stage.hours - currentHours);

            return `
              <div class="relative pl-7 pb-4 last:pb-1">
                ${idx < st.stages.length - 1 ? `<div class="absolute left-[11px] top-6 bottom-0 w-[2px] ${passed ? 'bg-cyan-400' : 'bg-indigo-500/25'}"></div>` : ''}
                <div class="absolute left-0 top-0.5 w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold ${
                  passed
                    ? 'bg-cyan-400 text-[#060811]'
                    : isCurrentTarget
                    ? 'bg-[#171F38] border-2 border-cyan-400 text-cyan-300'
                    : 'bg-[#0F1526] border border-indigo-500/35 text-slate-500'
                }">
                  ${passed ? '✓' : isCurrentTarget ? '◉' : '🔒'}

                    ${passed ? t('stagePassed') : `${stage.hours} ${t('hourShort')} · ${stagePct}%`}

                  <div class="w-full h-1.5 rounded-full bg-[#090D1A] overflow-hidden mt-1.5">
                    <div class="h-full rounded-full" style="width:${stagePct}%; background: linear-gradient(90deg, var(--indigo), var(--cyan));"></div>
                  </div>
                  <div class="text-[11px] text-cyan-300/85 mt-1">${t('stageLeft')} ${remH % 1 === 0 ? remH : remH.toFixed(1)} ${t('hourShort')}</div>
                ` : ''}
              </div>
            `;
          }).join('');

          roadmapHtml = `
            <div class="mt-4 pt-4 border-t border-indigo-500/20">
              <div class="space-y-1">${stagesRows}</div>

              <div class="grid grid-cols-3 gap-2 my-4">
                <div class="bg-[#090D1A]/85 border border-indigo-500/20 rounded-2xl p-2.5 text-center">
                  <div class="text-[11px] text-slate-400">${t('focusStat')}</div>
                  <div class="mono text-xs font-bold text-cyan-300 mt-0.5">${formatShortHours(skill.focusMinutes || 0)}</div>
                </div>
                <div class="bg-[#090D1A]/85 border border-indigo-500/20 rounded-2xl p-2.5 text-center">
                  <div class="text-[11px] text-slate-400">${t('routineStat')}</div>
                  <div class="mono text-xs font-bold text-purple-300 mt-0.5">${formatShortHours(skill.routineMinutes || 0)}</div>
                </div>
                <div class="bg-[#090D1A]/85 border border-indigo-500/20 rounded-2xl p-2.5 text-center">
                  <div class="text-[11px] text-slate-400">${t('sessionsStat')}</div>
                  <div class="mono text-xs font-bold text-white mt-0.5">${skill.sessionsCount || 0}</div>
                </div>
              </div>

              <div class="flex items-center gap-2">
                <button data-edit-skill="${skill.id}" class="flex-1 py-2.5 rounded-xl bg-[#171F38] border border-indigo-400/30 hover:border-cyan-400/60 text-xs font-bold text-indigo-200 transition">
                  ✏️ ${t('editSkill')}
                </button>
                <button data-delete-skill="${skill.id}" class="flex-1 py-2.5 rounded-xl bg-rose-950/35 border border-rose-500/30 hover:bg-rose-900/45 text-xs font-bold text-rose-300 transition">
                  🗑️ ${t('deleteSkill')}
                </button>
              </div>
            </div>
          `;
        }

        card.innerHTML = `
          <div data-toggle-skill="${skill.id}" class="cursor-pointer">

    function drawDaysCanvas(filteredSessions) {
      const canvas = document.getElementById('daysCanvas');
      const dpr = window.devicePixelRatio || 1;
      const rect = canvas.getBoundingClientRect();
      const width = rect.width || 340;
      const height = 176;
      canvas.width = width * dpr;
      canvas.height = height * dpr;
      const ctx = canvas.getContext('2d');
      ctx.scale(dpr, dpr);
      ctx.clearRect(0, 0, width, height);

      const cyanCol = getCssVar('--cyan') || '#2DE2FF';
      const indigoCol = getCssVar('--indigo') || '#5B6CFF';
      const purpleCol = getCssVar('--purple') || '#9747FF';
      const mutedCol = getCssVar('--text-muted') || '#94A3B8';

      const daysCount = state.analyticsPeriod === 'day' ? 1 : state.analyticsPeriod === 'week' ? 7 : 14;
      const bars = [];
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const weekdays = t('weekdaysShort');

      for (let i = daysCount - 1; i >= 0; i--) {
        const d = new Date(today);
        d.setDate(today.getDate() - i);
        const iso = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        const daySess = filteredSessions.filter(s => s.date === iso);
        const f = daySess.filter(s => s.mode === 'deep').reduce((a, b) => a + b.minutes, 0);
        const r = daySess.filter(s => s.mode === 'routine').reduce((a, b) => a + b.minutes, 0);
        const wd = weekdays[(d.getDay() + 6) % 7];
        const label = state.analyticsPeriod === 'month' ? `${d.getDate()}` : wd;
        bars.push({ label, f, r, total: f + r });
      }

      const maxVal = Math.max(30, ...bars.map(b => b.total));
      const padBottom = 24;
      const padTop = 12;
      const chartH = height - padBottom - padTop;
      const slotW = width / bars.length;
      const barW = Math.min(28, slotW * 0.56);

      ctx.strokeStyle = 'rgba(120, 135, 185, 0.16)';
      ctx.lineWidth = 1;
      for (let g = 0; g <= 2; g++) {
        const y = padTop + (chartH / 2) * g;
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(width, y);
        ctx.stroke();
      }

      bars.forEach((b, idx) => {
        const x = idx * slotW + (slotW - barW) / 2;
        const fH = (b.f / maxVal) * chartH;
        const rH = (b.r / maxVal) * chartH;
        const baseY = padTop + chartH;

        if (b.total === 0) {
          ctx.fillStyle = 'rgba(120, 135, 185, 0.18)';
          roundRect(ctx, x, baseY - 4, barW, 4, 2);
          ctx.fill();
        } else {
          if (fH > 0) {
            const gradF = ctx.createLinearGradient(0, baseY - fH, 0, baseY);
            gradF.addColorStop(0, cyanCol);
            gradF.addColorStop(1, indigoCol);
            ctx.fillStyle = gradF;
            roundRect(ctx, x, baseY - fH, barW, fH, 5);
            ctx.fill();
          }
          if (rH > 0) {
            const gradR = ctx.createLinearGradient(0, baseY - fH - rH, 0, baseY - fH);
            gradR.addColorStop(0, purpleCol);
            gradR.addColorStop(1, indigoCol);
            ctx.fillStyle = gradR;
            roundRect(ctx, x, baseY - fH - rH - (fH > 0 ? 2 : 0), barW, rH, 5);
            ctx.fill();
          }
        }

        ctx.fillStyle = mutedCol;
        ctx.font = '600 10px Inter, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(b.label, x + barW / 2, height - 6);
      });
    }

    function drawSkillsCanvas(filteredSessions) {
      const canvas = document.getElementById('skillsCanvas');
      const listEl = document.getElementById('skillsBreakdownList');
      const dpr = window.devicePixelRatio || 1;
      const rect = canvas.getBoundingClientRect();
      const width = rect.width || 340;
      const height = 192;
      canvas.width = width * dpr;
      canvas.height = height * dpr;
      const ctx = canvas.getContext('2d');
      ctx.scale(dpr, dpr);
      ctx.clearRect(0, 0, width, height);

      const textCol = getCssVar('--text-primary') || '#F4F7FF';
      const indigoCol = getCssVar('--indigo') || '#5B6CFF';
      const cyanCol = getCssVar('--cyan') || '#2DE2FF';
      const insetCol = getCssVar('--surface-inset') || 'rgba(15, 21, 38, 0.9)';

      const map = {};
      filteredSessions.forEach(s => {
        if (!map[s.skillId]) {
          const sk = state.skills.find(item => item.id === s.skillId);
          map[s.skillId] = {
            name: sk ? sk.name : s.skillName,
            icon: sk ? sk.icon : '⚡',
            color: sk ? sk.color : cyanCol,
            minutes: 0
          };
        }
        map[s.skillId].minutes += s.minutes;
      });

      const items = Object.values(map).sort((a, b) => b.minutes - a.minutes);
      const totalMins = items.reduce((a, b) => a + b.minutes, 0);

      listEl.innerHTML = '';
      if (items.length === 0) {
        ctx.fillStyle = getCssVar('--text-muted') || '#64748B';
        ctx.font = '600 12px Inter, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(t('noDataYet'), width / 2, height / 2);
        return;
      }

      const rowH = Math.min(38, (height - 16) / items.length);
      const maxMin = Math.max(1, items[0].minutes);

      items.forEach((item, i) => {
        const y = 10 + i * rowH;
        const pct = Math.round((item.minutes / totalMins) * 100);
        const barMaxW = width - 135;
        const barW = Math.max(8, (item.minutes / maxMin) * barMaxW);

        ctx.fillStyle = textCol;
        ctx.font = '700 11px Inter, sans-serif';
        ctx.textAlign = 'left';
        const shortName = item.name.length > 14 ? item.name.slice(0, 13) + '…' : item.name;
        ctx.fillText(`${item.icon} ${shortName}`, 4, y + 15);

        ctx.fillStyle = insetCol;
        roundRect(ctx, 125, y + 4, barMaxW, 14, 7);
        ctx.fill();

        const grad = ctx.createLinearGradient(125, 0, 125 + barW, 0);
        grad.addColorStop(0, indigoCol);
        grad.addColorStop(1, item.color || cyanCol);
        ctx.fillStyle = grad;
        roundRect(ctx, 125, y + 4, barW, 14, 7);
        ctx.fill();

        const row = document.createElement('div');
        row.className = 'flex items-center justify-between text-xs';
        row.innerHTML = `
          <div class="flex items-center gap-2 font-bold text-white">
            <span>${item.icon}</span>
            <span>${escapeHtml(item.name)}</span>
          </div>
          <div class="mono text-cyan-300 font-bold">${formatHoursMinutes(item.minutes)} (${pct}%)</div>
        `;
        listEl.appendChild(row);
      });
    }

    function roundRect(ctx, x, y, w, h, r) {
      const radius = Math.min(r, w / 2, h / 2);
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.arcTo(x + w, y, x + w, y + h, radius);
      ctx.arcTo(x + w, y + h, x, y + h, radius);
      ctx.arcTo(x, y + h, x, y, radius);
      ctx.arcTo(x, y, x + w, y, radius);
      ctx.closePath();
    }

    function renderHeatmap() {
      const gridEl = document.getElementById('heatmapGrid');
      const monthsEl = document.getElementById('heatmapMonths');
      const weekdaysEl = document.getElementById('heatmapWeekdays');
      gridEl.innerHTML = '';
      monthsEl.innerHTML = '';
      weekdaysEl.innerHTML = '';

      const h0 = getCssVar('--heat-0') || '#101522';
      const h1 = getCssVar('--heat-1') || '#29305A';
      const h2 = getCssVar('--heat-2') || '#414CC7';
      const h3 = getCssVar('--heat-3') || '#7B52FF';
      const h4 = getCssVar('--heat-4') || '#2DE2FF';

      const wd = t('weekdaysShort');
      [wd[0], wd[2], wd[4], wd[6]].forEach(label => {
        const sp = document.createElement('span');
        sp.textContent = label;
        weekdaysEl.appendChild(sp);
      });

      const dayStats = {};
      state.sessions.forEach(s => {
        if (!dayStats[s.date]) dayStats[s.date] = { minutes: 0, xp: 0, sessions: 0 };
        dayStats[s.date].minutes += s.minutes;
        dayStats[s.date].xp += s.xp;
        dayStats[s.date].sessions += 1;
      });

      const weeks = 20;
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const currentDow = (today.getDay() + 6) % 7;
      const endSunday = new Date(today);
      endSunday.setDate(today.getDate() + (6 - currentDow));

      const startMonday = new Date(endSunday);
      startMonday.setDate(endSunday.getDate() - (weeks * 7 - 1));

      const monthsShort = t('monthsShort');
      let lastMonth = -1;

      for (let w = 0; w < weeks; w++) {
        const col = document.createElement('div');
        col.className = 'flex flex-col gap-1';

        const weekFirstDay = new Date(startMonday);
        weekFirstDay.setDate(startMonday.getDate() + w * 7);
        const mLabel = document.createElement('div');
        mLabel.className = 'w-[15px] text-left';
        if (weekFirstDay.getMonth() !== lastMonth) {
          mLabel.textContent = monthsShort[weekFirstDay.getMonth()];
          lastMonth = weekFirstDay.getMonth();
        }
        monthsEl.appendChild(mLabel);

        for (let d = 0; d < 7; d++) {
          const cellDate = new Date(startMonday);
          cellDate.setDate(startMonday.getDate() + w * 7 + d);
          const iso = `${cellDate.getFullYear()}-${String(cellDate.getMonth() + 1).padStart(2, '0')}-${String(cellDate.getDate()).padStart(2, '0')}`;
          const info = dayStats[iso] || { minutes: 0, xp: 0, sessions: 0 };

          let color = h0;
          if (info.minutes > 0 && info.minutes < 30) color = h1;
          else if (info.minutes >= 30 && info.minutes < 60) color = h2;
          else if (info.minutes >= 60 && info.minutes < 120) color = h3;
          else if (info.minutes >= 120) color = h4;

          const cell = document.createElement('div');
          cell.className = `heatmap-cell ${state.selectedHeatmapDate === iso ? 'selected' : ''}`;
          cell.style.backgroundColor = color;
          cell.title = `${iso}: ${info.minutes} ${t('minShort')}`;
          cell.addEventListener('click', () => {
            state.selectedHeatmapDate = iso;
            renderHeatmap();
          });
          col.appendChild(cell);
        }
        gridEl.appendChild(col);
      }

      const infoBox = document.getElementById('heatmapSelectedInfo');
      if (state.selectedHeatmapDate) {
        const dStat = dayStats[state.selectedHeatmapDate] || { minutes: 0, xp: 0, sessions: 0 };
        const locale = state.lang === 'ua' ? 'uk-UA' : 'ru-RU';
        const formatted = new Date(state.selectedHeatmapDate + 'T00:00:00').toLocaleDateString(locale, { day: 'numeric', month: 'long', year: 'numeric' });
        infoBox.innerHTML = `
          <span class="font-bold text-white">${formatted}</span>
          <span class="mono font-bold text-cyan-300">${formatHoursMinutes(dStat.minutes)} · +${Math.round(dStat.xp)} XP</span>
        `;
      } else {
        infoBox.innerHTML = `<span>${t('heatmapHint')}</span>`;
      }
    }
