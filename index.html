            </div>
          </div>

          <button id="mProOk" class="w-full py-3.5 rounded-2xl neon-btn text-sm font-extrabold">${t('proGotItBtn')}</button>
        </div>
      `);
      document.getElementById('mCloseTop').onclick = closeModal;
      document.getElementById('mProOk').onclick = closeModal;
    }

    function openEditNameModal() {
      openModal(`
        <h3 class="text-lg font-black text-white mb-3">${t('modalEditNameTitle')}</h3>
        <input id="inpUserName" type="text" maxlength="24" value="${escapeHtml(state.userName)}" placeholder="${t('modalNamePlaceholder')}"
          class="w-full px-4 py-3 rounded-2xl bg-[#090D1A] border border-indigo-400/35 text-white font-semibold focus:outline-none focus:border-cyan-400" />
        <div class="grid grid-cols-2 gap-3 mt-4">
          <button id="mCancel" class="py-3 rounded-2xl bg-[#171F38] text-slate-300 font-bold text-sm">${t('cancelBtn')}</button>
          <button id="mSave" class="py-3 rounded-2xl neon-btn text-white font-extrabold text-sm">${t('saveBtn')}</button>
        </div>
      `);
      document.getElementById('mCancel').onclick = closeModal;
      document.getElementById('mSave').onclick = () => {
        const val = document.getElementById('inpUserName').value.trim();
        if (val) {
          state.userName = val;
          saveState();
          renderAll();
        }
        closeModal();
      };
    }

    function openEditGoalModal() {
      openModal(`
        <h3 class="text-lg font-black text-white mb-2">${t('modalGoalTitle')}</h3>
        <p class="text-xs text-slate-400 mb-3">${t('modalGoalMinutes')}</p>
        <input id="inpDailyGoal" type="number" min="10" max="720" step="10" value="${state.dailyGoalMinutes}"
          class="w-full px-4 py-3 rounded-2xl bg-[#090D1A] border border-indigo-400/35 text-white mono font-bold text-lg focus:outline-none focus:border-cyan-400" />
        <div class="flex gap-2 mt-3">
          ${[60, 120, 180, 240].map(m => `<button type="button" data-preset-goal="${m}" class="flex-1 py-2 rounded-xl bg-[#171F38] border border-indigo-500/25 text-xs font-bold text-cyan-300">${m / 60} ${t('hourShort')}</button>`).join('')}
        </div>
        <div class="grid grid-cols-2 gap-3 mt-4">
          <button id="mCancel" class="py-3 rounded-2xl bg-[#171F38] text-slate-300 font-bold text-sm">${t('cancelBtn')}</button>
          <button id="mSave" class="py-3 rounded-2xl neon-btn text-white font-extrabold text-sm">${t('saveBtn')}</button>
        </div>
      `);
      modalBox.querySelectorAll('[data-preset-goal]').forEach(b => {
        b.onclick = () => {
          document.getElementById('inpDailyGoal').value = b.getAttribute('data-preset-goal');
        };
      });
      document.getElementById('mCancel').onclick = closeModal;
      document.getElementById('mSave').onclick = () => {
        const val = parseInt(document.getElementById('inpDailyGoal').value, 10);
        if (val >= 5) {
          state.dailyGoalMinutes = val;
          saveState();
          renderAll();
        }
        closeModal();
      };
    }

    function openStartTimerModal(skillId) {
      const skill = state.skills.find(s => s.id === skillId) || state.skills[0];
      if (!skill) return;
      openModal(`
        <div class="flex items-center gap-3 mb-4">
          <div class="w-12 h-12 rounded-2xl bg-[#171F38] border border-cyan-400/35 flex items-center justify-center text-2xl">${skill.icon}</div>
          <div>
            <div class="text-xs text-cyan-300 font-bold">${t('modalStartTitle')}</div>
            <div class="text-lg font-black text-white">${escapeHtml(skill.name)}</div>
          </div>
        </div>
        <label class="block text-xs text-slate-300 font-semibold mb-2">${t('modalSessionDuration')}</label>
        <input id="inpSessionMin" type="number" min="1" max="300" value="25"
          class="w-full px-4 py-3 rounded-2xl bg-[#090D1A] border border-indigo-400/35 text-white mono font-bold text-lg focus:outline-none focus:border-cyan-400" />
        <div class="grid grid-cols-4 gap-2 mt-3">
          ${[15, 25, 45, 60].map(m => `<button type="button" data-dur="${m}" class="py-2 rounded-xl bg-[#171F38] border border-indigo-500/25 text-xs font-bold text-cyan-300">${m} ${t('minShort')}</button>`).join('')}
        </div>
        <div class="grid grid-cols-2 gap-3 mt-5">
          <button id="mCancel" class="py-3 rounded-2xl bg-[#171F38] text-slate-300 font-bold text-sm">${t('cancelBtn')}</button>
          <button id="mStart" class="py-3 rounded-2xl neon-btn text-white font-extrabold text-sm">▶ ${t('startBtn')}</button>
        </div>
      `);
      modalBox.querySelectorAll('[data-dur]').forEach(b => {
        b.onclick = () => {
          document.getElementById('inpSessionMin').value = b.getAttribute('data-dur');
        };
      });
      document.getElementById('mCancel').onclick = closeModal;
      document.getElementById('mStart').onclick = () => {
        const dur = parseInt(document.getElementById('inpSessionMin').value, 10) || 25;
        closeModal();
        startTimerForSkill(skill.id, dur);
      };
    }

    function openManualLogModal() {
      if (state.skills.length === 0) return;
      const options = state.skills.map(s => `<option value="${s.id}">${s.icon} ${escapeHtml(s.name)}</option>`).join('');
      openModal(`
        <h3 class="text-lg font-black text-white mb-4">${t('modalManualTitle')}</h3>
        <div class="space-y-3">
          <div>
            <label class="block text-xs text-slate-400 mb-1">${t('selectSkillLabel')}</label>
            <select id="manSkill" class="w-full px-3.5 py-3 rounded-2xl bg-[#090D1A] border border-indigo-400/35 text-white font-semibold focus:outline-none">
              ${options}
            </select>
          </div>
          <div>
            <label class="block text-xs text-slate-400 mb-1">${t('minutesLabel')}</label>
            <input id="manMinutes" type="number" min="1" max="600" value="30"
              class="w-full px-4 py-3 rounded-2xl bg-[#090D1A] border border-indigo-400/35 text-white mono font-bold focus:outline-none" />
          </div>
          <div>
            <label class="block text-xs text-slate-400 mb-1">${t('modeLabel')}</label>
            <select id="manMode" class="w-full px-3.5 py-3 rounded-2xl bg-[#090D1A] border border-indigo-400/35 text-white font-semibold focus:outline-none">
              <option value="deep">⚡ ${t('deepStudy')} (×1.5 XP)</option>
              <option value="routine">☕ ${t('routineDuty')} (×0.5 XP)</option>
            </select>
          </div>
        </div>
        <div class="grid grid-cols-2 gap-3 mt-5">
          <button id="mCancel" class="py-3 rounded-2xl bg-[#171F38] text-slate-300 font-bold text-sm">${t('cancelBtn')}</button>
          <button id="mAdd" class="py-3 rounded-2xl neon-btn text-white font-extrabold text-sm">${t('addBtn')}</button>
        </div>
      `);
      document.getElementById('mCancel').onclick = closeModal;
      document.getElementById('mAdd').onclick = () => {
        const sid = document.getElementById('manSkill').value;
        const mins = parseInt(document.getElementById('manMinutes').value, 10) || 15;
        const mode = document.getElementById('manMode').value;
        closeModal();
        recordStudySession(sid, mins, mode, true);
      };
    }

    function openSessionCelebrationModal({ skillName, skillIcon, minutes, earnedXp, mode, leveledUp, newLevel, goalJustCompleted }) {
      openModal(`
        <div class="text-center py-2">
          <div class="w-20 h-20 mx-auto rounded-3xl p-[2px] avatar-glow" style="background: linear-gradient(45deg, var(--indigo), var(--purple), var(--cyan));">
            <div class="w-full h-full rounded-3xl bg-[#0B1020] flex items-center justify-center text-4xl">
              ${leveledUp ? '👑' : skillIcon}
            </div>
          </div>

          ${leveledUp ? `<div class="mt-3 inline-block px-3 py-1 rounded-full bg-cyan-400/20 border border-cyan-400 text-cyan-300 text-xs font-black tracking-wider">${t('modalLevelUpTitle')} ${t('levelWord')} ${newLevel}</div>` : ''}
          ${goalJustCompleted ? `<div class="mt-2 inline-block px-3 py-1 rounded-full bg-purple-500/25 border border-purple-400 text-purple-200 text-xs font-black tracking-wider">🎯 ${t('modalGoalDoneTitle')}</div>` : ''}

          <h3 class="text-xl font-black text-white mt-3">${t('modalSessionDoneTitle')}</h3>
          <p class="text-xs text-slate-400 mt-1">${escapeHtml(skillName)} · ${t('modalSessionDoneSub')}</p>

          <div class="grid grid-cols-2 gap-3 my-5">
            <div class="bg-[#090D1A]/90 border border-indigo-500/25 rounded-2xl p-3">
              <div class="text-[11px] text-slate-400">${t('minutesLabel')}</div>
              <div class="mono text-lg font-black text-white mt-0.5">+${minutes} ${t('minShort')}</div>
            </div>
            <div class="bg-[#090D1A]/90 border border-cyan-400/35 rounded-2xl p-3">
              <div class="text-[11px] text-cyan-300">${t('xpEarned')}</div>
              <div class="mono text-lg font-black text-cyan-300 mt-0.5">+${earnedXp} XP</div>
            </div>
          </div>

          <button id="mDone" class="w-full py-3.5 rounded-2xl neon-btn text-white font-extrabold text-sm">${t('continueBtn')}</button>
        </div>
      `);
      document.getElementById('mDone').onclick = closeModal;
    }

    function openSkillEditorModal(editSkillId = null) {
      const existing = editSkillId ? state.skills.find(s => s.id === editSkillId) : null;
      const nameVal = existing ? existing.name : '';
      const iconVal = existing ? existing.icon : '🚀';
      const colorVal = existing ? existing.color : '#2DE2FF';
      const stagesVal = existing && existing.roadmap && existing.roadmap.length
        ? existing.roadmap
        : [
            { id: 's1', name: 'A1 / Старт', hours: 0 },
            { id: 's2', name: 'A2 / База', hours: 25 },
            { id: 's3', name: 'B1 / Уверенный', hours: 60 }
          ];

      const palette = ['#2DE2FF', '#5B6CFF', '#9747FF', '#10B981', '#F59E0B', '#EC4899'];

      openModal(`
        <h3 class="text-lg font-black text-white mb-4">${existing ? t('modalSkillTitleEdit') : t('modalSkillTitleNew')}</h3>
        <div class="space-y-3">
          <div>
            <label class="block text-xs text-slate-400 mb-1">${t('skillNameLabel')}</label>
            <input id="skName" type="text" value="${escapeHtml(nameVal)}" placeholder="Python / UX / Spanish"
              class="w-full px-3.5 py-2.5 rounded-2xl bg-[#090D1A] border border-indigo-400/35 text-white font-semibold focus:outline-none focus:border-cyan-400" />
          </div>

          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs text-slate-400 mb-1">${t('skillIconLabel')}</label>
              <input id="skIcon" type="text" maxlength="4" value="${escapeHtml(iconVal)}"
                class="w-full px-3.5 py-2.5 rounded-2xl bg-[#090D1A] border border-indigo-400/35 text-white text-center text-xl focus:outline-none focus:border-cyan-400" />
            </div>
            <div>
              <label class="block text-xs text-slate-400 mb-1">${t('skillColorLabel')}</label>
              <div class="flex items-center gap-1.5 pt-1.5 flex-wrap" id="colorPalette">
                ${palette.map(c => `<button type="button" data-color="${c}" class="w-6 h-6 rounded-full border-2 ${c === colorVal ? 'border-white scale-110' : 'border-transparent'}" style="background:${c}"></button>`).join('')}
              </div>
              <input type="hidden" id="skColor" value="${colorVal}" />
            </div>
          </div>

          <div>
            <div class="flex items-center justify-between mb-1.5">
              <label class="text-xs text-slate-300 font-bold">${t('roadmapStagesLabel')}</label>
              <button type="button" id="btnAddStageRow" class="text-xs font-bold text-cyan-300 hover:underline">${t('addStageBtn')}</button>
            </div>
            <div id="stagesEditorList" class="space-y-2 max-h-48 overflow-y-auto pr-1"></div>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3 mt-5">
          <button id="mCancel" class="py-3 rounded-2xl bg-[#171F38] text-slate-300 font-bold text-sm">${t('cancelBtn')}</button>
          <button id="mSaveSkill" class="py-3 rounded-2xl neon-btn text-white font-extrabold text-sm">${t('saveBtn')}</button>
        </div>
      `);

      const stagesList = document.getElementById('stagesEditorList');
      function addStageRow(name = '', hours = 0) {
        const row = document.createElement('div');
        row.className = 'flex items-center gap-2 stage-row';
        row.innerHTML = `
          <input type="text" value="${escapeHtml(name)}" placeholder="${t('stageNamePlaceholder')}"
            class="st-name flex-1 px-3 py-2 rounded-xl bg-[#090D1A] border border-indigo-500/30 text-xs text-white font-semibold" />
          <input type="number" min="0" max="5000" value="${hours}" placeholder="${t('stageHoursPlaceholder')}"
            class="st-hours w-20 px-2.5 py-2 rounded-xl bg-[#090D1A] border border-indigo-500/30 text-xs text-cyan-300 mono font-bold" />
          <button type="button" class="st-del text-rose-400 px-1.5 text-sm font-bold">✕</button>
        `;
        row.querySelector('.st-del').onclick = () => row.remove();
        stagesList.appendChild(row);
      }

      stagesVal.forEach(s => addStageRow(s.name, s.hours));
      document.getElementById('btnAddStageRow').onclick = () => addStageRow('', 50);

      modalBox.querySelectorAll('[data-color]').forEach(btn => {
        btn.onclick = () => {
          const c = btn.getAttribute('data-color');
          document.getElementById('skColor').value = c;
          modalBox.querySelectorAll('[data-color]').forEach(b => b.classList.remove('border-white', 'scale-110'));
          btn.classList.add('border-white', 'scale-110');
        };
      });

      document.getElementById('mCancel').onclick = closeModal;
      document.getElementById('mSaveSkill').onclick = () => {
        const name = document.getElementById('skName').value.trim();
        if (!name) return;
        const icon = document.getElementById('skIcon').value.trim() || '⚡';
        const color = document.getElementById('skColor').value || '#2DE2FF';

        const roadmap = [];
        stagesList.querySelectorAll('.stage-row').forEach((r, idx) => {
          const sName = r.querySelector('.st-name').value.trim();
          const sHours = Math.max(0, parseFloat(r.querySelector('.st-hours').value) || 0);
          if (sName) {
            roadmap.push({ id: 'stg_' + Date.now() + '_' + idx, name: sName, hours: sHours });
          }
        });
        roadmap.sort((a, b) => a.hours - b.hours);

        if (existing) {
          existing.name = name;
          existing.icon = icon;
          existing.color = color;
          existing.roadmap = roadmap;
        } else {
          const newId = 'skill_' + Date.now();
          state.skills.push({
            id: newId,
            name,
            icon,
            color,
            focusMinutes: 0,
            routineMinutes: 0,
            sessionsCount: 0,
            roadmap
          });
          state.expandedSkillId = newId;
        }
        saveState();
        closeModal();
        renderAll();
      };
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    /* ============================================================================
       10. NAVIGATION, BEFOREUNLOAD & EVENT BINDINGS
    ============================================================================ */
    function switchTab(tabName) {
      state.activeTab = tabName;
      saveState();

      document.querySelectorAll('.screen').forEach(sc => sc.classList.remove('active'));
      const activeScreen = document.getElementById(`screen-${tabName}`);
      if (activeScreen) activeScreen.classList.add('active');

      document.querySelectorAll('.nav-item').forEach(btn => {
        if (btn.getAttribute('data-tab') === tabName) {
          btn.classList.add('active');
          btn.classList.remove('text-slate-400');
        } else {
          btn.classList.remove('active');
          btn.classList.add('text-slate-400');
        }
      });

      if (tabName === 'analytics') {
        renderAnalyticsScreen();
      }
    }

    // Защита от случайного закрытия/обновления вкладки во время активного таймера
    window.addEventListener('beforeunload', (e) => {
      if (state.timer && state.timer.isActive) {
        e.preventDefault();
        e.returnValue = '';
      }
    });

    document.querySelectorAll('.nav-item').forEach(btn => {
      btn.addEventListener('click', () => switchTab(btn.getAttribute('data-tab')));
    });

    document.querySelectorAll('.theme-option-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        applyTheme(btn.getAttribute('data-theme-choice'));
      });
    });

    document.getElementById('btnHeaderPro').addEventListener('click', openProModal);
    document.getElementById('btnProfilePro').addEventListener('click', openProModal);

    document.getElementById('langUA').addEventListener('click', () => {
      state.lang = 'ua';
      saveState();
      renderAll();
    });

    document.getElementById('langRU').addEventListener('click', () => {
      state.lang = 'ru';
      saveState();
      renderAll();
    });

    document.getElementById('btnEditName').addEventListener('click', openEditNameModal);
    document.getElementById('profileUserName').addEventListener('click', openEditNameModal);
    document.getElementById('btnEditDailyGoal').addEventListener('click', openEditGoalModal);
    document.getElementById('btnQuickManualLog').addEventListener('click', openManualLogModal);
    document.getElementById('btnOpenAddSkill').addEventListener('click', () => openSkillEditorModal(null));

    document.getElementById('modeDeepBtn').addEventListener('click', () => {
      state.focusMode = 'deep';
      saveState();
      renderFocusScreen();
    });

    document.getElementById('modeRoutineBtn').addEventListener('click', () => {
      state.focusMode = 'routine';
      saveState();
      renderFocusScreen();
    });

    document.getElementById('btnPauseResume').addEventListener('click', togglePauseTimer);
    document.getElementById('btnFinishSession').addEventListener('click', finishTimerSession);
    document.getElementById('btnCancelSession').addEventListener('click', cancelTimerWithoutSave);

    document.querySelectorAll('.period-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        state.analyticsPeriod = btn.getAttribute('data-period');
        saveState();
        renderAnalyticsScreen();
      });
    });

    document.getElementById('btnExportJson').addEventListener('click', () => {
      const dataStr = JSON.stringify(state, null, 2);
      const blob = new Blob([dataStr], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `studyflow_pro_backup_${getTodayISO()}.json`;
      a.click();
      URL.revokeObjectURL(url);
      spawnFloatingXp(t('exportSuccess'));
    });

    document.getElementById('inputImportJson').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        try {
          const imported = JSON.parse(ev.target.result);
          if (imported && typeof imported === 'object' && Array.isArray(imported.skills)) {
            state = { ...getDefaultState(), ...imported };
            saveState();
            renderAll();
            switchTab(state.activeTab || 'profile');
            alert(t('importSuccess'));
          } else {
            alert(t('importError'));
          }
        } catch (err) {
          alert(t('importError'));
        }
      };
      reader.readAsText(file);
      e.target.value = '';
    });

    document.getElementById('btnResetAllData').addEventListener('click', () => {
      if (confirm(t('confirmResetAll'))) {
        const keepLang = state.lang;
        const keepTheme = state.theme;
        StorageService.clear();
        state = getDefaultState();
        state.lang = keepLang;
        state.theme = keepTheme;
        saveState();
        renderAll();
        switchTab('focus');
      }
    });

    window.addEventListener('resize', () => {
      if (state.activeTab === 'analytics') {
        renderAnalyticsScreen();
      }
    });

    /* ============================================================================
       11. INITIALIZE APP
    ============================================================================ */
    ensureTimerLoop();
    renderAll();
    switchTab(state.activeTab || 'focus');
  </script>
</body>
</html>
